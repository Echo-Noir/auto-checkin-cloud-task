name: daily-checkin

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend deps
        working-directory: backend
        run: npm install

      - name: Run daily check-in
        working-directory: backend
        env:
          MONKEYCODE_SESSION: ${{ secrets.MONKEYCODE_SESSION }}
          BAIZHI_SESSION: ${{ secrets.BAIZHI_SESSION }}
        run: npx tsx src/cli.ts
